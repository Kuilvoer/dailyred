name: Build Daily Red ROM

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev pkg-config

      - name: Install xPack ARM Toolchain
        run: |
          mkdir -p .toolchain
          curl -fL -o gcc.tar.gz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz
          tar -xzf gcc.tar.gz -C .toolchain
          ln -s xpack-arm-none-eabi-gcc-14.2.1-1.1 .toolchain/arm-none-eabi
          .toolchain/arm-none-eabi/bin/arm-none-eabi-gcc --version

      - name: Fetch and patch pokefirered
        run: |
          chmod +x scripts/*.sh
          bash scripts/get-pokefirered.sh

      - name: Build ROM
        run: |
          export PATH="$GITHUB_WORKSPACE/.toolchain/arm-none-eabi/bin:$PATH"
          make -C pokefirered -j$(nproc) TOOLCHAIN="$GITHUB_WORKSPACE/.toolchain/arm-none-eabi" MODERN=1
          mkdir -p web/game
          gzip -9 -n -c pokefirered/pokefirered_modern.gba > web/game/dailyred.gba.gz
          cp pokefirered/graphics/trainers/front_pics/red_front_pic.png web/game/red.png
          ls -la web/game/

      - name: Upload game artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-rom
          path: web/game/

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0 web/game/dailyred.gba.gz web/game/red.png --clobber || gh release create v2.0 web/game/dailyred.gba.gz web/game/red.png --title "Daily Red v2.0 Competitive" --notes "Competitive update"
